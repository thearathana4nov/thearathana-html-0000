<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="AUB.png">
</head>

<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="bg.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="login-container">


        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to my website.
        </p>
        <form>

            <div class="input-box">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>
            <div class="input-box">
                <label>Your age</label>
                <input class="date" type="date" name="dob" required style="color: #64748b;">
            </div>
            <div class="input-box messange">
                <label>Messages</label>
                <input type="text" placeholder="messages me" required>
            </div>

            <div class="login-options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                <a href="https://thearathana-html-7777.vercel.app/" style="text-decoration: none; color: #d0cdcd;">
                    Login →</a>
            </button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="index.html">Sign Up</a>
        </p>

    </div>

</body>

</html>
